[package]
name = "wgpu_native"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib for macOS (.dylib), staticlib for iOS (.a)
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Disable default features, enable only what we need
# - wgsl: shader language support
# - metal: Apple platform backend (macOS/iOS)
# - dx12: Windows backend
# - vulkan: Android/Linux Vulkan backend
# - vulkan-portability: MoltenVK on Apple (Vulkan over Metal)
wgpu = { version = "29", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan", "vulkan-portability", "gles"] }
wgpu-hal = { version = "29", default-features = false, features = ["dx12", "vulkan", "metal"] }
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# Apple (macOS/iOS): IOSurface texture interop + native windowing
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
core-foundation = "0.10"
raw-window-handle = "0.6"

# Windows: DXGI texture interop + native windowing
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Graphics_Direct3D11on12",
]}
raw-window-handle = "0.6"

# Linux: Native window surface support (X11/Wayland swapchain)
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"

# Android: Native window surface support
[target.'cfg(target_os = "android")'.dependencies]
ash = "0.38"
raw-window-handle = "0.6"
jni = "0.21"
ndk = "0.9"
ndk-sys = "0.6"
android_logger = "0.14"

[profile.release]
lto = true
codegen-units = 1
