# cbindgen configuration for wgpu_native
# Run: cbindgen --config cbindgen.toml --output include/wgpu_native.h

language = "C"
header = """
// wgpu_native - FFI bindings for wgpu
// AUTO-GENERATED by cbindgen - DO NOT EDIT
"""
include_guard = "WGPU_NATIVE_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]

[export]
# Export all public items from lib.rs
include = []
# Exclude Apple-specific types that don't translate to valid C
exclude = ["__IOSurface", "IOSurfaceRef", "IOSurfaceCreate", "IOSurfaceGetID",
           "kIOSurfaceWidth", "kIOSurfaceHeight", "kIOSurfaceBytesPerElement",
           "kIOSurfaceBytesPerRow", "kIOSurfacePixelFormat", "AppleSurface"]

[export.rename]
# Keep Rust naming conventions

[fn]
# Function naming
prefix = ""
postfix = ""

[struct]
# Struct naming
rename_fields = "None"

[enum]
# Enum naming
rename_variants = "None"

[defines]
# Map Rust #[cfg] to C preprocessor defines so cbindgen doesn't warn.
# We generate a universal header — platform code is excluded via [export].
"target_vendor = apple" = "TARGET_APPLE"
"target_os = android" = "TARGET_ANDROID"
"target_os = windows" = "TARGET_WINDOWS"

[parse]
parse_deps = false
