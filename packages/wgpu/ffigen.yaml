# ffigen configuration for wgpu bindings
# Run: dart run ffigen --config ffigen.yaml

name: WgpuNativeBindings
description: Auto-generated FFI bindings for wgpu_native
output: lib/src/ffi/bindings_generated.dart

ffi-native:
  asset-id: 'package:wgpu/wgpu_native'

headers:
  entry-points:
    - native/include/wgpu_native.h

# Generate documentation from C comments
comments:
  style: any
  length: full

functions:
  include:
    - 'wgpun_.*'
    - 'naga_.*'

structs:
  include:
    - 'WGPU.*Descriptor'
    - 'Naga.*'

unions:
  include: []

enums:
  include: []

typedefs:
  include: []

globals:
  exclude:
    - '__security_cookie'

macros:
  include:
    - 'INSTANCE_.*'
    - 'FORMAT_.*'

preamble: |
  // AUTO-GENERATED by ffigen - DO NOT EDIT
  // Run `./gen_bindings.sh` to regenerate
  //
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
