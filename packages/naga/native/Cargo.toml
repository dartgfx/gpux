[package]
name = "naga_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
naga = { version = "29", features = [
    "wgsl-in",
    "glsl-in",
    "spv-in",
    "wgsl-out",
    "glsl-out",
    "spv-out",
    "msl-out",
    "hlsl-out",
] }

[profile.release]
lto = true
codegen-units = 1
