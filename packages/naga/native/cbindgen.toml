# cbindgen configuration for naga_native
# Run: cbindgen --config cbindgen.toml --output include/naga_native.h

language = "C"
header = """
// naga_native - FFI bindings for naga validation and translation
// AUTO-GENERATED by cbindgen - DO NOT EDIT
"""
include_guard = "NAGA_NATIVE_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]

[export]
include = []
exclude = []

[fn]
prefix = ""
postfix = ""

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"

[parse]
parse_deps = false
