# ffigen configuration for naga bindings
# Run: dart run ffigen --config ffigen.yaml

name: NagaNativeBindings
description: Auto-generated FFI bindings for naga_native
output: lib/src/ffi/bindings_generated.dart

# Use @Native annotations for Native Assets integration
ffi-native:
  asset-id: 'package:naga/naga_native'

headers:
  entry-points:
    - native/include/naga_native.h

comments:
  style: any
  length: full

functions:
  include:
    - 'naga_.*'

structs:
  include:
    - 'Naga.*'

unions:
  include: []

enums:
  include: []

typedefs:
  include: []

globals:
  exclude:
    - '__security_cookie'

macros:
  include: []

preamble: |
  // AUTO-GENERATED by ffigen - DO NOT EDIT
  // Run `./gen_bindings.sh` to regenerate
  //
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
