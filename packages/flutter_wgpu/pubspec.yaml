name: flutter_wgpu
description: Flutter plugin that bridges wgpu GPU textures to Flutter.
version: 0.1.0
repository: https://github.com/dartgfx/gpux
topics:
  - gpu
  - flutter
  - graphics

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

resolution: workspace

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterWgpuPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterWgpuPlugin
        sharedDarwinSource: true
      android:
        package: dev.dartgfx.flutter_wgpu
        pluginClass: FlutterWgpuPlugin
      windows:
        pluginClass: FlutterWgpuPluginCApi
      linux:
        pluginClass: FlutterWgpuPlugin

dependencies:
  flutter:
    sdk: flutter
  wgpu: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
